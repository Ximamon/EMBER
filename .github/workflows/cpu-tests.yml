name: CPU and terrain tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install terrain tools
        run: python -m pip install -r tools/terrain/requirements.txt
      - name: Configure CPU baseline
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DEMBER_ENABLE_MPI=OFF -DEMBER_ENABLE_CUDA=OFF -DAVX2=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: C++ regression and terrain tests
        run: ctest --test-dir build --output-on-failure
      - name: Offline geospatial integration tests
        run: python -m unittest discover -s tests -p 'test_terrain_tools.py' -v
